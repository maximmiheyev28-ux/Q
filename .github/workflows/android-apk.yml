name: Rust Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PNG assets
        run: |
          python3 -m pip install --quiet pillow
          python3 assets/generate_assets.py
          file assets/*.png
          python3 - <<'PY'
          from PIL import Image
          import glob, os
          required = {"city.png": (480,270), "metal_tile.png": (16,16), "samurai.png": (128,48), "enemies.png": (96,48), "projectiles.png": (64,16), "effects.png": (256,48)}
          for name, size in required.items():
              path = os.path.join("assets", name)
              assert os.path.isfile(path), f"Missing asset: {name}"
              with Image.open(path) as image:
                  assert image.size == size, f"{name}: expected {size}, got {image.size}"
                  assert image.mode == "RGBA", f"{name}: expected RGBA"
          print("All six game texture assets verified.")
          PY
      - name: Build native Rust Android APK
        run: |
          docker run --rm -v "${{ github.workspace }}:/root/src" -w /root/src notfl3/cargo-apk cargo quad-apk build --release
      - name: Verify APK package
        run: |
          APK="$(find target/android-artifacts/release/apk -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p dist
          cp "$APK" dist/NEON-BLADE-Rust-Android.apk
          sha256sum dist/NEON-BLADE-Rust-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEON-BLADE-Rust-Android-APK
          path: dist/NEON-BLADE-Rust-Android.apk
          if-no-files-found: error
          retention-days: 30
