name: Rust Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare PNG assets
        run: |
          mkdir -p assets
          base64 -d app/src/main/assets/city.png.b64 > assets/city.png
          base64 -d app/src/main/assets/sprites.png.b64 > assets/sprites.png
          base64 -d app/src/main/assets/metal_tile.png.b64 > assets/metal_tile.png
          file assets/*.png
      - name: Build native Rust Android APK
        run: |
          docker run --rm -v "${{ github.workspace }}:/root/src" -w /root/src notfl3/cargo-apk cargo quad-apk build --release
      - name: Verify APK package
        run: |
          APK="$(find target/android-artifacts/release/apk -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          unzip -t "$APK"
          mkdir -p dist
          cp "$APK" dist/NEON-BLADE-Rust-Android.apk
          sha256sum dist/NEON-BLADE-Rust-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NEON-BLADE-Rust-Android-APK
          path: dist/NEON-BLADE-Rust-Android.apk
          if-no-files-found: error
          retention-days: 30
